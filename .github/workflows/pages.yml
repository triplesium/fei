name: Deploy Editor Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to bundle in the demo
        required: true
        default: samples/projects/skyline_strike
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build / WebAssembly / release
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      EDITOR_DEMO_PROJECT: ${{ inputs.project || 'samples/projects/skyline_strike' }}
      LLVM_ROOT: 'C:\Program Files\LLVM'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.0.9'
          package-cache: true
          package-cache-key: windows-wasm-release-emscripten6-slang2026.14.1-prebuilt-luau-release
          project-path: '.'

      - name: Configure release demo
        run: >-
          xmake f -p wasm -m release --shader_targets=webgpu
          --editor_demo_project="$env:EDITOR_DEMO_PROJECT" -y

      - name: Build release demo
        run: xmake build -y -vD entisium-editor-demo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/wasm/wasm32/release/editor-demo

  deploy:
    name: deploy / GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
