<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>fei WebGPU browser sample</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #141f33;
            }

            #canvas {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
            }

            #error {
                position: fixed;
                inset: 16px;
                display: none;
                overflow: auto;
                padding: 16px;
                color: #ffd7d7;
                background: rgb(45 8 12 / 92%);
                border: 1px solid #e35d6a;
                border-radius: 8px;
                font: 14px/1.5 monospace;
                white-space: pre-wrap;
                z-index: 1;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" tabindex="-1"></canvas>
        <pre id="error"></pre>
        <script>
            const errorElement = document.getElementById("error");
            const editorChannelId = new URLSearchParams(location.search).get(
                "fei-editor-channel",
            );
            const postEditorMessage = (type, detail = {}) => {
                if (!editorChannelId || window.parent === window) return;
                window.parent.postMessage(
                    {
                        source: "fei-runtime",
                        channelId: editorChannelId,
                        type,
                        ...detail,
                    },
                    location.origin,
                );
            };
            const showError = (message) => {
                errorElement.style.display = "block";
                errorElement.textContent += `${message}\n`;
                postEditorMessage("runtime.error", {
                    message: String(message),
                });
            };
            window.addEventListener("error", (event) => {
                const message = event.error?.stack ?? event.message;
                console.error("[fei] window error:", message);
                showError(message);
            });
            window.addEventListener("unhandledrejection", (event) => {
                const message = event.reason?.stack ?? event.reason;
                console.error("[fei] unhandled rejection:", message);
                showError(message);
            });
            if (!window.isSecureContext) {
                showError("WebGPU requires HTTPS or a localhost secure context.");
            } else if (!navigator.gpu) {
                showError("This browser has no WebGPU implementation enabled.");
            }
            const resourceVersion = Date.now().toString();
            var Module = {
                canvas: document.getElementById("canvas"),
                preRun: [
                    () => {
                        if (!editorChannelId) return;
                        const dependency = "fei-editor-project";
                        addRunDependency(dependency);
                        const timeout = setTimeout(() => {
                            showError("Timed out waiting for editor project files.");
                            removeRunDependency(dependency);
                        }, 30000);
                        const receiveProject = (event) => {
                            if (
                                event.source !== window.parent ||
                                event.origin !== location.origin ||
                                event.data?.source !== "fei-editor" ||
                                event.data?.channelId !== editorChannelId ||
                                event.data?.type !== "project.files"
                            ) {
                                return;
                            }
                            window.removeEventListener(
                                "message",
                                receiveProject,
                            );
                            clearTimeout(timeout);
                            try {
                                const root = "/fei/assets/web-project";
                                FS.mkdirTree(`${root}/assets`);
                                for (const file of event.data.files ?? []) {
                                    const path = String(file.path ?? "");
                                    if (
                                        path.length === 0 ||
                                        path.startsWith("/") ||
                                        path.includes("..") ||
                                        (path !== "project.yaml" &&
                                            !path.startsWith("assets/"))
                                    ) {
                                        throw new Error(
                                            `Rejected editor project path: ${path}`,
                                        );
                                    }
                                    const directory = path
                                        .split("/")
                                        .slice(0, -1)
                                        .join("/");
                                    if (directory) {
                                        FS.mkdirTree(`${root}/${directory}`);
                                    }
                                    const content = file.content;
                                    if (content instanceof Uint8Array) {
                                        FS.writeFile(`${root}/${path}`, content);
                                    } else {
                                        FS.writeFile(
                                            `${root}/${path}`,
                                            String(content ?? ""),
                                            { encoding: "utf8" },
                                        );
                                    }
                                }
                                postEditorMessage("project.applied");
                            } catch (error) {
                                showError(
                                    error?.stack ?? error?.message ?? error,
                                );
                            } finally {
                                removeRunDependency(dependency);
                            }
                        };
                        window.addEventListener("message", receiveProject);
                        postEditorMessage("project.request");
                    },
                    () => {
                        const dependency = "fei-webgpu-device";
                        addRunDependency(dependency);
                        const initializeWebGpu = async () => {
                            try {
                                document.documentElement.dataset.feiStatus =
                                    "initializing webgpu";
                                if (!navigator.gpu) {
                                    throw new Error(
                                        "This browser has no WebGPU implementation enabled.",
                                    );
                                }
                                let adapter =
                                    await navigator.gpu.requestAdapter({
                                        powerPreference: "high-performance",
                                    });
                                if (!adapter) {
                                    adapter =
                                        await navigator.gpu.requestAdapter({
                                            featureLevel: "compatibility",
                                            powerPreference:
                                                "high-performance",
                                        });
                                }
                                if (!adapter) {
                                    throw new Error(
                                        "Failed to request a WebGPU adapter.",
                                    );
                                }
                                const requiredFeatures = [];
                                if (
                                    adapter.features.has("float32-filterable")
                                ) {
                                    requiredFeatures.push(
                                        "float32-filterable",
                                    );
                                }
                                const device = await adapter.requestDevice({
                                    label: "fei WebGPU device",
                                    requiredFeatures,
                                });
                                device.addEventListener(
                                    "uncapturederror",
                                    (event) => {
                                        const message = `WebGPU uncaptured error: ${event.error.message}`;
                                        console.error("[fei] " + message);
                                        showError(message);
                                    },
                                );
                                device.lost.then((info) => {
                                    const message = `WebGPU device lost (${info.reason}): ${info.message}`;
                                    console.error("[fei] " + message);
                                    showError(message);
                                });
                                Module.preinitializedWebGPUDevice = device;
                                removeRunDependency(dependency);
                            } catch (error) {
                                document.documentElement.dataset.feiStatus =
                                    "webgpu initialization failed";
                                const message =
                                    error?.stack ?? error?.message ?? error;
                                console.error(
                                    "[fei] WebGPU initialization failed:",
                                    message,
                                );
                                showError(message);
                            }
                        };
                        initializeWebGpu();
                    },
                ],
                locateFile: (path, prefix) =>
                    `${prefix}${path}?dev=${resourceVersion}`,
                print: (...args) => {
                    console.log(...args);
                    postEditorMessage("runtime.log", {
                        level: "info",
                        message: args.join(" "),
                    });
                },
                printErr: (...args) => {
                    console.error(...args);
                    postEditorMessage("runtime.log", {
                        level: "error",
                        message: args.join(" "),
                    });
                    showError(args.join(" "));
                },
            };
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
