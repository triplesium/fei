<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>fei WebGPU browser sample</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #141f33;
            }

            #canvas {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
            }

            #error {
                position: fixed;
                inset: 16px;
                display: none;
                overflow: auto;
                padding: 16px;
                color: #ffd7d7;
                background: rgb(45 8 12 / 92%);
                border: 1px solid #e35d6a;
                border-radius: 8px;
                font: 14px/1.5 monospace;
                white-space: pre-wrap;
                z-index: 1;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" tabindex="-1"></canvas>
        <pre id="error"></pre>
        <script>
            const errorElement = document.getElementById("error");
            const showError = (message) => {
                errorElement.style.display = "block";
                errorElement.textContent += `${message}\n`;
            };
            window.addEventListener("error", (event) => {
                const message = event.error?.stack ?? event.message;
                console.error("[fei] window error:", message);
                showError(message);
            });
            window.addEventListener("unhandledrejection", (event) => {
                const message = event.reason?.stack ?? event.reason;
                console.error("[fei] unhandled rejection:", message);
                showError(message);
            });
            if (!window.isSecureContext) {
                showError("WebGPU requires HTTPS or a localhost secure context.");
            } else if (!navigator.gpu) {
                showError("This browser has no WebGPU implementation enabled.");
            }
            const resourceVersion = Date.now().toString();
            var Module = {
                canvas: document.getElementById("canvas"),
                preRun: [
                    () => {
                        const dependency = "fei-webgpu-device";
                        addRunDependency(dependency);
                        const initializeWebGpu = async () => {
                            try {
                                document.documentElement.dataset.feiStatus =
                                    "initializing webgpu";
                                if (!navigator.gpu) {
                                    throw new Error(
                                        "This browser has no WebGPU implementation enabled.",
                                    );
                                }
                                let adapter =
                                    await navigator.gpu.requestAdapter({
                                        powerPreference: "high-performance",
                                    });
                                if (!adapter) {
                                    adapter =
                                        await navigator.gpu.requestAdapter({
                                            featureLevel: "compatibility",
                                            powerPreference:
                                                "high-performance",
                                        });
                                }
                                if (!adapter) {
                                    throw new Error(
                                        "Failed to request a WebGPU adapter.",
                                    );
                                }
                                const requiredFeatures = [];
                                if (
                                    adapter.features.has("float32-filterable")
                                ) {
                                    requiredFeatures.push(
                                        "float32-filterable",
                                    );
                                }
                                const device = await adapter.requestDevice({
                                    label: "fei WebGPU device",
                                    requiredFeatures,
                                });
                                device.addEventListener(
                                    "uncapturederror",
                                    (event) => {
                                        const message = `WebGPU uncaptured error: ${event.error.message}`;
                                        console.error("[fei] " + message);
                                        showError(message);
                                    },
                                );
                                device.lost.then((info) => {
                                    const message = `WebGPU device lost (${info.reason}): ${info.message}`;
                                    console.error("[fei] " + message);
                                    showError(message);
                                });
                                Module.preinitializedWebGPUDevice = device;
                                removeRunDependency(dependency);
                            } catch (error) {
                                document.documentElement.dataset.feiStatus =
                                    "webgpu initialization failed";
                                const message =
                                    error?.stack ?? error?.message ?? error;
                                console.error(
                                    "[fei] WebGPU initialization failed:",
                                    message,
                                );
                                showError(message);
                            }
                        };
                        initializeWebGpu();
                    },
                ],
                locateFile: (path, prefix) =>
                    `${prefix}${path}?dev=${resourceVersion}`,
                print: (...args) => console.log(...args),
                printErr: (...args) => {
                    console.error(...args);
                    showError(args.join(" "));
                },
            };
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
