# Copy to <project>/.entisium/config.yaml for automatic project configuration.
# Alternatively use %APPDATA%/Entisium/config.yaml or Agent --config <path>.
version: 1

providers:
  deepseek:
    type: openai-compatible
    chat:
      baseUrl: https://api.deepseek.com
      api: responses
    apiKey: replace-with-your-deepseek-key
  router:
    type: openrouter
    apiKey: replace-with-your-openrouter-key
  fal:
    type: fal
    apiKey: replace-with-your-fal-key

agent:
  model: { provider: deepseek, id: deepseek-v4-flash }
  reasoning: high

imageGeneration:
  model: { provider: router, id: openai/gpt-image-2 }
  timeoutMs: 600000
  defaults:
    resolution: 1K
    aspect_ratio: "1:1"
    quality: auto

# To use fal.ai GPT Image 2.5 instead:
# imageGeneration:
#   model: { provider: fal, id: openai/gpt-image-2.5/sunburst/text-to-image }
#   defaults: { resolution: 1K, aspect_ratio: "1:1", quality: high }
# No providers.<id>.models catalogue is required for either capability.

runtime:
  executable: auto
